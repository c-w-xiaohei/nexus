# Release
#
# This workflow runs on every push to main after a PR is merged.
# It automatically handles versioning, changelog generation, and publishing to npm.
# This workflow uses the changesets/action to manage the entire release process.

name: Release

on:
  push:
    branches:
      - main

# Grant release PR permissions and allow npm trusted publishing via OIDC.
permissions:
  contents: write
  id-token: write
  pull-requests: write

# Prevent concurrent releases to avoid race conditions
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # We need full history to calculate correct version bumps
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node.js 22.14.0+ and npm 11.5.1+.
          node-version: 24
          cache: "pnpm"
          # Configure npm registry for publishing
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This command will automatically:
          # 1. Run 'changeset version' to update package versions and generate changelog
          # 2. Run 'changeset publish' to publish packages to npm
          # 3. Create GitHub releases
          publish: pnpm changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Expose the repository token to subprocesses that read GITHUB_TOKEN directly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC is preferred for configured packages; the token is the fallback for
          # first-time package publishes, before trusted publishing can be configured.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
